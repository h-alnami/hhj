<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALL OF NARIS - Ashen Forest Gameplay (With Character)</title>
<style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #050505; color: white; }
    canvas { display: block; }
    #hud {
        position: absolute; top: 20px; right: 20px;
        background: rgba(0,0,0,0.8); padding: 15px;
        border: 2px solid #00e5ff; border-radius: 8px;
        text-align: center; z-index: 10;
    }
    #score { font-size: 24px; color: #ffaa00; }
    #startOverlay {
        position: absolute; inset: 0; background: rgba(0,0,0,0.9);
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; z-index: 20; text-align: center;
    }
    #startOverlay button {
        background: #00e5ff; border: none; padding: 12px 24px;
        border-radius: 5px; cursor: pointer; font-weight: bold;
        font-size: 18px; margin-top: 10px;
    }
    #characterLoad { margin-top: 10px; font-size: 12px; color: #aaa; display:block; }
    #crosshair {
        position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
        background: #ffaa00; border-radius: 50%;
        transform: translate(-50%, -50%); pointer-events: none;
    }
    #backLink {
        position: absolute; top: 20px; left: 20px; z-index: 10;
        color: #00e5ff; text-decoration: none; font-size: 14px;
        background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 6px;
        border: 1px solid #00e5ff;
    }
    #backLink:hover { background: #00e5ff; color: #000; }
</style>
</head>
<body>
<a id="backLink" href="NARIS_DASHBOARD_MAIN.html">⬅ العودة للوحة التحكم</a>
<div id="crosshair"></div>
<div id="hud">
    <div>اجمع الرونات:</div>
    <div id="score">0</div>
</div>
<div id="startOverlay">
    <h1>عالم الغابة الرمادية</h1>
    <p>اضغط للدخول (WASD للحركة، الماوس للنظر حولك)</p>
    <button onclick="startGame()">🚀 دخول الغابة</button>
    <label id="characterLoad">أو قم بتحميل شخصيتك (GLB):
        <input type="file" id="charInput" accept=".glb" hidden>
    </label>
    <button onclick="document.getElementById('charInput').click()">تحميل Ashen Vessel</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// إضاءة
scene.add(new THREE.AmbientLight(0x404060, 0.8));
const dirLight = new THREE.DirectionalLight(0xffaa00, 1.2);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const cyanLight = new THREE.DirectionalLight(0x00e5ff, 0.5);
cyanLight.position.set(-10, 10, -10);
scene.add(cyanLight);

// الأرض والأشجار
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function addDeadTree(x, z) {
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.5, 3),
        new THREE.MeshStandardMaterial({ color: 0x332211 })
    );
    trunk.position.set(x, 1.5, z);
    scene.add(trunk);

    const branch = new THREE.Mesh(
        new THREE.ConeGeometry(0.8, 1.5, 4),
        new THREE.MeshStandardMaterial({ color: 0x221100 })
    );
    branch.position.set(x + 0.3, 3.2, z);
    branch.rotation.z = 0.3;
    scene.add(branch);
}
for (let i = 0; i < 40; i++) addDeadTree((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);

// بوابة الرماد
const gate = new THREE.Mesh(
    new THREE.BoxGeometry(4, 6, 1),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 })
);
gate.position.set(0, 3, -30);
scene.add(gate);

const gateGlow = new THREE.Mesh(
    new THREE.TorusGeometry(1.8, 0.1, 16, 32),
    new THREE.MeshBasicMaterial({ color: 0x00e5ff })
);
gateGlow.position.set(0, 3, -29.5);
scene.add(gateGlow);

// الرونات
const interactables = [];
const runeMat = new THREE.MeshStandardMaterial({
    color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 1.5
});
for (let i = 0; i < 20; i++) {
    const rune = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), runeMat);
    rune.position.set((Math.random() - 0.5) * 60, 1, (Math.random() - 0.5) * 60);
    rune.userData.isRune = true;
    interactables.push(rune);
    scene.add(rune);
}

// الشخصية
let charGroup = null;
const loader = new GLTFLoader();

document.getElementById('charInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        loader.load(URL.createObjectURL(file), (gltf) => {
            if (charGroup) scene.remove(charGroup);
            charGroup = gltf.scene;
            const box = new THREE.Box3().setFromObject(charGroup);
            const size = box.getSize(new THREE.Vector3());
            const scale = 2 / (size.y || 1);
            charGroup.scale.setScalar(scale);
            scene.add(charGroup);
        }, undefined, (err) => {
            alert('فشل تحميل النموذج: ' + (err.message || err));
        });
    }
});

// تحكم
const controls = new PointerLockControls(camera, document.body);
const keys = {};
let score = 0;

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

window.startGame = () => {
    document.getElementById('startOverlay').style.display = 'none';
    controls.lock();
};

function animate() {
    requestAnimationFrame(animate);

    if (controls.isLocked) {
        const delta = 0.1;
        const speed = keys['ShiftLeft'] ? 0.6 : 0.25;
        let velocityZ = 0, velocityX = 0;

        if (keys['KeyW']) velocityZ = -speed;
        if (keys['KeyS']) velocityZ = speed;
        if (keys['KeyA']) velocityX = -speed;
        if (keys['KeyD']) velocityX = speed;

        controls.moveRight(-velocityX * delta);
        controls.moveForward(-velocityZ * delta);
        camera.position.y = 2;

        if (charGroup) {
            charGroup.position.x = camera.position.x;
            charGroup.position.z = camera.position.z;
            charGroup.position.y = camera.position.y - 2;
        }

        interactables.forEach(obj => {
            if (obj.userData.isRune) {
                obj.rotation.y += 0.02;
                if (camera.position.distanceTo(obj.position) < 3) {
                    scene.remove(obj);
                    obj.userData.isRune = false;
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }
        });
    }
    renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
